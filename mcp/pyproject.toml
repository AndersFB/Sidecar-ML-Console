[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sidecar-ml-mcp"
version = "1.0.0"
description = "MCP server exposing a Sidecar ML iPhone's on-device ML API as agent tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "sidecar-ml", "on-device", "ml", "iphone"]

dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.27",
    "zeroconf>=0.132",
    "loguru>=0.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
sidecar-ml-mcp = "sidecar_ml_mcp.server:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/sidecar_ml_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
